[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-domain-squatter-scanner"
version = "1.0.0"
description = "Scan installed agent skills for hallucinated, unregistered, or typosquatted domains in instructions (stdlib only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
skill-domain-squatter-scanner = "skill_domain_squatter_scanner:main"

[tool.setuptools]
py-modules = ["skill_domain_squatter_scanner"]
